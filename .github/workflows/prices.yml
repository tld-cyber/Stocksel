name: Refresh prices

# The fast half. Reads the committed floors, fetches current prices for the two ends that the page
# actually renders, rebuilds the HTML and deploys it to Pages. ~1 minute per run.
#
# Builds the page and deploys it straight to Pages as an artifact — nothing is committed, so the
# repository does not grow by 685 KB on every refresh.
#
# Triggered externally by cron-job.org every 15 minutes during market hours, NOT by the schedule
# below. GitHub's own scheduler ran between 7 minutes and 6 hours late across a full trading day
# here, which is unusable for prices. The cron entry is left as a backstop: if the external trigger
# ever stops, an erratic refresh still beats none.
#
# Schedule covers 13:00-20:59 UTC Mon-Fri, which is 09:00-16:59 ET in summer and 08:00-15:59 in
# winter — the market session under either, since cron has no notion of daylight saving. The odd
# minute offsets keep it off the top of the hour, where GitHub's scheduler queues worst; runs are
# best-effort regardless and can be late under load, so treat the stamp on the page as the truth
# rather than assuming a fixed cadence.
on:
  schedule:
    - cron: '7,22,37,52 13-20 * * 1-5'
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily floor scan"]     # publish immediately after fresh floors land
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; skip a queued run rather than stack them, since the next one is only
# 15 minutes away and would carry newer prices anyway.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # --prices reads data/floors.json. If the daily scan has never run, it falls back to a full
      # scan on its own rather than failing — the first deploy after setup still produces a page.
      - run: python publish_static.py --prices

      # Deploy the artifact instead of committing it. Committing was a workaround from when GitHub's
      # scheduler was the only trigger and proved unreliable; with an external trigger that is no
      # longer needed. It matters because git keeps every version forever — a 685 KB page committed
      # 27 times a day is roughly 4.5 GB a year of repository growth for a file nobody reads twice.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
