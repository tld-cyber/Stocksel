name: Refresh prices

# The fast half. Reads the committed floors, fetches current prices for the two ends that the page
# actually renders, rebuilds the HTML and deploys it to Pages. ~1 minute per run.
#
# Commits the built page. That does add a commit per refresh, which is the price of not depending on
# GitHub's Actions scheduler — it never fired once across a full trading day here, while every manual
# and local run worked. The Mac's launchd job pushes the same file, so either trigger publishes.
#
# Schedule covers 13:00-20:59 UTC Mon-Fri, which is 09:00-16:59 ET in summer and 08:00-15:59 in
# winter — the market session under either, since cron has no notion of daylight saving. The odd
# minute offsets keep it off the top of the hour, where GitHub's scheduler queues worst; runs are
# best-effort regardless and can be late under load, so treat the stamp on the page as the truth
# rather than assuming a fixed cadence.
on:
  schedule:
    - cron: '7,22,37,52 13-20 * * 1-5'
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily floor scan"]     # publish immediately after fresh floors land
    types: [completed]

permissions:
  contents: write

# Never let two deploys race; skip a queued run rather than stack them, since the next one is only
# 15 minutes away and would carry newer prices anyway.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install yfinance pandas pytz

      # --prices reads data/floors.json. If the daily scan has never run, it falls back to a full
      # scan on its own rather than failing — the first deploy after setup still produces a page.
      - run: python publish_static.py --prices

      # Commit the built page rather than deploying an artifact: Pages serves docs/ from the branch,
      # so a push IS the publish. Same mechanism the Mac's launchd job uses, so whichever trigger
      # fires, the result is identical.
      - name: Commit the page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash -q origin main || true
          git push origin main
